# Optional, owner-approved PAID deployment. Nothing is provisioned by committing this file.
services:
  - type: web
    name: resource-planning
    runtime: node
    plan: starter
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
    startCommand: npm run start:hosted
    healthCheckPath: /api/health
    disk:
      name: workforce
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.22.3
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      # Supplied privately by the operator, never on Pages or in this repo.
      - key: RP_OWNER_NAME
        sync: false
      - key: RP_OWNER_EMAIL
        sync: false
      - key: RP_OWNER_PASSWORD
        sync: false
